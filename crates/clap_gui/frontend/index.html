<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>clap-gui</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="vendor/prism-tomorrow.min.css">
</head>
<body>
  <div class="titlebar">
    <span class="titlebar-close" id="close-btn" title="Close (Esc)">&#x2715;</span>
    <span class="titlebar-title" id="titlebar-title">clap-gui</span>
    <span class="titlebar-pin" id="pin-btn" title="Pin window">&#128204;</span>
  </div>

  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="files">Files</button>
    <button class="mode-tab" data-mode="grep">Grep</button>
  </div>

  <div class="search-container">
    <span class="search-icon">&#128269;</span>
    <input class="search-input" id="search-input" type="text" placeholder="Search files..." autofocus>
  </div>

  <div class="main-content">
    <div class="results-pane" id="results-pane"></div>
    <div class="preview-pane" id="preview-pane">
      <div class="preview-empty">No file selected</div>
    </div>
  </div>

  <div class="statusbar">
    <span id="status-count">0 results</span>
    <span>Enter: open · Tab: mode · Ctrl+D/⌘Q: quit · Esc: clear/close</span>
  </div>

  <script>window.Prism = window.Prism || {}; Prism.manual = true;</script>
  <script src="vendor/prism.min.js"></script>
  <script src="vendor/prism-rust.min.js"></script>
  <script src="vendor/prism-python.min.js"></script>
  <script src="vendor/prism-javascript.min.js"></script>
  <script src="vendor/prism-typescript.min.js"></script>
  <script src="vendor/prism-go.min.js"></script>
  <script src="vendor/prism-c.min.js"></script>
  <script src="vendor/prism-cpp.min.js"></script>
  <script src="vendor/prism-java.min.js"></script>
  <script src="vendor/prism-bash.min.js"></script>
  <script src="vendor/prism-toml.min.js"></script>
  <script src="vendor/prism-json.min.js"></script>
  <script src="vendor/prism-yaml.min.js"></script>
  <script src="vendor/prism-css.min.js"></script>
  <script src="vendor/prism-markup.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/search.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/keybindings.js"></script>
</body>
</html>
