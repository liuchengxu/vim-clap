# Standalone workspace - separate from main vim-clap workspace
# This avoids Tauri version conflicts with other crates

[workspace]
members = ["."]

[package]
name = "mead"
description = "MEAD — Markdown Editor with AI and Dictionary"
version = "0.1.0"
edition = "2021"
authors = ["Liu-Cheng Xu <xuliuchengxlc@gmail.com>"]
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Core library from parent workspace (path dependency)
markdown_preview_core = { path = "../crates/markdown_preview_core" }

# Standard dependencies
byteorder = "1.5"
dirs = "5.0"
flate2 = "1.0"
futures = "0.3"
lopdf = "0.34"
mdict-parser = "0.1"
portable-pty = "0.9"
regex = "1"
reqwest = { version = "0.12", features = ["json", "native-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "2"
tokio = { version = "1.36", features = ["sync", "fs", "process", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Tauri and plugins
tauri = { version = "2.0", features = ["devtools"] }
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-opener = "2.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
