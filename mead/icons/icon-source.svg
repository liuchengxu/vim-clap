<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="honey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="honeyEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C49000"/>
      <stop offset="100%" stop-color="#A07808"/>
    </linearGradient>
  </defs>
  <!-- Hexagon shape (flat-top orientation) -->
  <polygon
    points="256,28 462,148 462,364 256,484 50,364 50,148"
    fill="url(#honey)"
    stroke="url(#honeyEdge)"
    stroke-width="12"
    stroke-linejoin="round"
  />
  <!-- White "M" letter -->
  <text
    x="256" y="330"
    font-family="Helvetica, Arial, sans-serif"
    font-weight="700"
    font-size="280"
    fill="white"
    text-anchor="middle"
    dominant-baseline="central"
    style="letter-spacing: -8px;"
  >M</text>
</svg>
